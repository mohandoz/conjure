# Generated by conjure eval init — do not edit manually
# NOTE: a skill was added AFTER this config was generated.
# This fixture simulates a coverage gap: audit should detect that
# the new skill has no skill-used assertion. See EVAL-05.

description: 'Conjure harness prompt-adherence eval'

providers:
  - id: anthropic:claude-agent-sdk
    config:
      working_dir: .
      setting_sources: ['project']
      skills: all
      permission_mode: dontAsk
      append_allowed_tools: ['Read', 'Bash']

evaluateOptions:
  repeat: 3

prompts:
  - 'Summarize the purpose of this project in one sentence.'

defaultTest:
  options:
    disableVarExpansion: true

tests:
  # Only audit-helper has a skill-used assertion.
  # The second installed skill was added after eval init — coverage gap.
  - description: 'skill routing: audit-helper'
    assert:
      - type: skill-used
        value: 'audit-helper'

  - description: 'rule: Always run shellcheck before committing bash scri'
    assert:
      - type: llm-rubric
        value: '- Always run shellcheck before committing bash scripts.'
        threshold: 0.8

  - description: 'rule: Never use exit 1 in hooks; use exit 2.'
    assert:
      - type: llm-rubric
        value: '- Never use exit 1 in hooks; use exit 2.'
        threshold: 0.8
