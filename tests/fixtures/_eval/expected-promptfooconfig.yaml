# Generated by conjure eval init — do not edit manually
# Source: https://www.promptfoo.dev/docs/configuration/reference/

description: 'Conjure harness prompt-adherence eval'

providers:
  - id: anthropic:claude-agent-sdk
    config:
      working_dir: .
      setting_sources: ['project']
      skills: all
      permission_mode: dontAsk
      append_allowed_tools: ['Read', 'Bash']

evaluateOptions:
  repeat: 3

# Prompt: a minimal task that exercises the harness; repeated for each test
prompts:
  - 'Summarize the purpose of this project in one sentence.'

defaultTest:
  options:
    disableVarExpansion: true

tests:
  # EVAL-01 skill-used: one block per installed skill
  # (skill-used is deterministic; no per-assertion repeat needed)
  - description: 'skill routing: audit-helper'
    assert:
      - type: skill-used
        value: 'audit-helper'

  - description: 'skill routing: code-review'
    assert:
      - type: skill-used
        value: 'code-review'

  # EVAL-01 llm-rubric: one block per CLAUDE.md rule line
  # (repeat:3 at evaluateOptions level provides the flakiness guard
  #  when combined with repeat-min-pass:2 in the GitHub Action)
  - description: 'rule: Always run shellcheck before committing bash scri'
    assert:
      - type: llm-rubric
        value: '- Always run shellcheck before committing bash scripts.'
        threshold: 0.8

  - description: 'rule: Never use exit 1 in hooks; use exit 2.'
    assert:
      - type: llm-rubric
        value: '- Never use exit 1 in hooks; use exit 2.'
        threshold: 0.8

  - description: 'rule: Backup before mutate: all file mutations route t'
    assert:
      - type: llm-rubric
        value: '- Backup before mutate: all file mutations route through lib/mutate.sh.'
        threshold: 0.8
